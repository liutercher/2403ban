<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2403班 小题分台账 · 逐题诊断</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2320584A'/%3E%3Cpath d='M9 8v16M16 8v16M23 8v10' stroke='%23FBFAF6' stroke-width='2'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#E7E9E2;
  --sheet:#FAFBF7;
  --sheet-2:#F2F4ED;
  --ink:#1A211E;
  --ink-2:#47524C;
  --ink-3:#79837C;
  --rule:#D3D7CC;
  --rule-2:#E3E6DC;
  --green:#20584A;
  --green-2:#3C7A64;
  --green-3:#DCE8E0;
  --red:#A5382A;
  --red-2:#F3E3DE;
  --blue:#2B5B8A;
  --amber:#8A6B22;
  --serif:"Source Han Serif SC","Noto Serif SC","思源宋体","STSong","SimSun",serif;
  --sans:"Microsoft YaHei","PingFang SC","Hiragino Sans GB","Noto Sans SC",system-ui,sans-serif;
  --mono:"Cascadia Mono",Consolas,"SF Mono",monospace;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.7;
  font-feature-settings:"tnum" 1,"lnum" 1;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit}
input,select{font-family:inherit}
h1,h2,h3,h4{margin:0;font-weight:600;font-family:var(--serif);letter-spacing:.01em}
p{margin:0}
table{border-collapse:collapse}
.page{max-width:1240px;margin:0 auto;padding:0 18px 64px}

.masthead{display:grid;gap:12px;padding:24px 0 14px;border-bottom:2px solid var(--ink)}
.mast-kicker{font-size:12px;letter-spacing:.24em;color:var(--green);font-weight:600}
.masthead h1{font-size:clamp(27px,6vw,42px);line-height:1.14;letter-spacing:-.01em}
.mast-meta{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:12.5px;color:var(--ink-2)}
.mast-meta span{display:inline-flex;align-items:center;gap:6px}
.dot{width:5px;height:5px;background:var(--green);display:inline-block;border-radius:50%}

.tabs{display:flex;flex-wrap:wrap;align-items:center;gap:0;margin-top:2px;border-bottom:1px solid var(--rule)}
.tabs button{
  appearance:none;background:none;border:0;border-bottom:2px solid transparent;
  padding:13px 2px 11px;margin-right:22px;cursor:pointer;
  font-size:14.5px;font-weight:600;color:var(--ink-3);letter-spacing:.02em;
  transition:color .15s,border-color .15s;
}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--green)}
.tabs .spacer{flex:1}
.tabs .back{
  font-size:12.5px;color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--rule);
  padding-bottom:1px;margin-left:10px;
}
.tabs .back:hover{color:var(--green);border-bottom-color:var(--green)}

.sec-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:26px 0 8px;border-bottom:1px solid var(--rule)}
.sec-head h2{font-size:19px}
.sec-head .no{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.1em}
.sec-head .sub{font-size:12.5px;color:var(--ink-3);margin-left:auto}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 14px;background:var(--sheet);border:1px solid var(--rule);margin-top:14px}
.bar .field{display:flex;align-items:center;gap:7px}
.bar .lbl{font-size:12.5px;color:var(--ink-2);letter-spacing:.04em}
.bar select,.bar input[type="text"],.bar input[type="number"]{
  padding:6px 8px;font-size:14px;border:1px solid var(--rule);background:#fff;color:var(--ink);
}
.bar select:focus,.bar input:focus{outline:2px solid var(--green-3);border-color:var(--green)}
.bar input[type="number"]{width:92px;text-align:right}
.bar .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--green);background:var(--green);color:#fff;font-size:13px;padding:7px 16px;cursor:pointer;letter-spacing:.04em}
.btn:hover{background:var(--green-2);border-color:var(--green-2)}
.btn.ghost{background:#fff;color:var(--ink-2);border-color:var(--rule)}
.btn.ghost:hover{border-color:var(--green);color:var(--green)}

.kpi{display:grid;grid-template-columns:repeat(2,1fr);border:1px solid var(--rule);background:var(--sheet);margin-top:16px}
.kpi-cell{padding:11px 14px 12px;border-bottom:1px solid var(--rule-2);border-right:1px solid var(--rule-2)}
.kpi-cell .k{font-size:11.5px;color:var(--ink-3);letter-spacing:.06em}
.kpi-cell .v{font-family:var(--serif);font-size:25px;line-height:1.3}
.kpi-cell .v span{font-size:12px;font-family:var(--sans);color:var(--ink-3);margin-left:3px}
.kpi-cell .d{font-size:11.5px;color:var(--ink-3);min-height:16px}
.up{color:var(--green)}
.down{color:var(--red)}

.block{margin-top:22px}
.block-head{display:flex;align-items:baseline;gap:10px;padding-bottom:6px;border-bottom:1px solid var(--rule-2);flex-wrap:wrap}
.block-head h3{font-size:15px;white-space:nowrap}
.block-head .hint{font-size:12px;color:var(--ink-3);margin-left:auto;text-align:right}
.card{background:var(--sheet);border:1px solid var(--rule);border-top:0;padding:14px}
.empty{padding:26px 14px;border:1px dashed var(--rule);color:var(--ink-3);font-size:13.5px;background:var(--sheet)}

.chart{width:100%;height:320px}
.chart.tall{height:420px}

.tw{overflow-x:auto;border:1px solid var(--rule);border-top:0;background:var(--sheet)}
table.qt{width:100%;font-size:12.8px;min-width:520px}
table.qt thead th{
  background:var(--sheet-2);font-weight:600;color:var(--ink-2);text-align:right;
  padding:8px 9px;border-bottom:1px solid var(--rule);white-space:nowrap;position:sticky;top:0;
}
table.qt thead th.l,table.qt td.l{text-align:left}
table.qt tbody td{padding:7px 9px;border-bottom:1px solid var(--rule-2);text-align:right;white-space:nowrap}
table.qt tbody tr:hover{background:var(--sheet-2)}
table.qt tbody tr.hl{background:var(--green-3)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border:1px solid var(--rule);color:var(--ink-2);background:#fff;letter-spacing:.02em}
.tag.ok{border-color:var(--green);color:var(--green)}
.tag.warn{border-color:var(--amber);color:var(--amber)}
.tag.bad{border-color:var(--red);color:var(--red)}

.talk{background:var(--sheet);border:1px solid var(--rule);border-top:0;padding:16px}
.talk h4{font-size:13px;color:var(--green);letter-spacing:.08em;margin-bottom:6px}
.talk p{font-size:13.5px;color:var(--ink-2);margin-bottom:9px}
.talk p b{color:var(--ink)}
.talk ul{margin:0 0 10px;padding-left:18px;font-size:13.5px;color:var(--ink-2)}
.talk li{margin-bottom:4px}

.note{font-size:12px;color:var(--ink-3);padding:10px 2px 0;line-height:1.7}
.foot{margin-top:34px;border-top:1px solid var(--rule);padding-top:12px;font-size:12px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:6px 18px}

@media (min-width:768px){
  .kpi{grid-template-columns:repeat(3,1fr)}
  .kpi-wide{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body>
<main class="page">

  <header class="masthead">
    <div class="mast-kicker">2403班 · 物化生 · 小题分台账</div>
    <h1>逐题得分与科目分析</h1>
    <div class="mast-meta">
      <span><i class="dot"></i>小题分覆盖：2026年10月考试（六科）</span>
      <span>在册 52 人 · 参考 50 人</span>
      <span>化、生按原始分做小题分析，赋分只用于总分</span>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button data-tab="stu" aria-selected="true">小题分查看</button>
    <button data-tab="ana" aria-selected="false">各科小题分析</button>
    <button data-tab="subj" aria-selected="false">科目分析</button>
    <span class="spacer"></span>
    <a class="back" href="index.html">返回成绩台账</a>
  </nav>

  <section id="view-stu">
    <div class="bar">
      <div class="field">
        <span class="lbl">考试</span>
        <select id="xExam"></select>
      </div>
      <div class="field">
        <span class="lbl">科目</span>
        <select id="xSubj"></select>
      </div>
      <div class="field">
        <span class="lbl">姓名</span>
        <input type="text" id="xName" list="xNameList" placeholder="输入学生姓名" autocomplete="off" style="width:150px">
        <datalist id="xNameList"></datalist>
      </div>
      <div class="acts">
        <button class="btn" id="xGo">查看</button>
        <button class="btn ghost" id="xRand">随便看一个</button>
      </div>
    </div>
    <div id="xOut"><div class="empty">输入姓名后查看本人该科的逐题得分、小题均分与得失分结构。</div></div>
  </section>

  <section id="view-ana" hidden>
    <div class="bar">
      <div class="field">
        <span class="lbl">考试</span>
        <select id="aExam"></select>
      </div>
      <div class="field">
        <span class="lbl">科目</span>
        <select id="aSubj"></select>
      </div>
      <div class="acts">
        <button class="btn ghost" id="aSort">按薄弱度排序</button>
      </div>
    </div>
    <div id="aOut"><div class="empty">选一场考试与一科，出该科全部小题的得分率、难度与区分度。</div></div>
  </section>

  <section id="view-subj" hidden>
    <div class="bar">
      <div class="field">
        <span class="lbl">考试</span>
        <select id="sExam"></select>
      </div>
      <div class="field">
        <span class="lbl">科目</span>
        <select id="sSubj"></select>
      </div>
      <div class="field">
        <span class="lbl">本科划线</span>
        <input type="number" id="sLine" step="0.5" min="0" max="150" placeholder="未录">
        <span class="lbl" id="sLineUnit">分</span>
      </div>
      <div class="field">
        <span class="lbl">姓名</span>
        <input type="text" id="sName" list="xNameList" placeholder="输入学生姓名" autocomplete="off" style="width:150px">
      </div>
      <div class="acts">
        <button class="btn" id="sGo">查看</button>
      </div>
    </div>
    <div id="sOut"><div class="empty">选考试与科目、录入本科划线，即可看到该科上线名单与个人历次走势。</div></div>
  </section>

  <footer class="foot">
    <span>数据来源：各科小题分/*.xlsx（每科一份，全年级名单中取高三3班 50 人）＋ 9 份成绩单</span>
    <span>划线随本机保存，与成绩台账共用同一份单科线</span>
    <span id="footTick"></span>
  </footer>
</main>

/* ===== 图表 ===== */
const CH = {};
function chart(id, opt) {
  const d = document.getElementById(id);
  if (!d || !window.echarts) return null;
  if (CH[id]) { CH[id].dispose(); delete CH[id]; }
  const c = echarts.init(d, null, { renderer: 'canvas' });
  c.setOption(opt);
  CH[id] = c;
  return c;
}
function baseTip() {
  return {
    trigger: 'axis',
    axisPointer: { type: 'line', lineStyle: { color: C.rule } },
    backgroundColor: '#FBFAF6', borderColor: C.rule, borderWidth: 1,
    textStyle: { color: C.ink, fontSize: 12, fontFamily: 'Microsoft YaHei' },
    extraCssText: 'box-shadow:none;border-radius:0;padding:8px 10px'
  };
}
function catAxis(data, extra) {
  return Object.assign({
    type: 'category', data: data,
    axisLine: { lineStyle: { color: C.rule } },
    axisTick: { show: false },
    axisLabel: { color: C.ink3, fontSize: 11 }
  }, extra || {});
}
function valAxis(extra) {

/* ===== 小题层面计算 ===== */
function presentNames(sub) { return Object.keys(sub.stu); }
function classQMean(sub) {
  const list = presentNames(sub).map(n => sub.stu[n]);
  return sub.qs.map((q, i) => {
    let s = 0, c = 0;
    list.forEach(d => { const v = d.s[i]; if (v !== null && v !== undefined) { s += v; c++; } });
    return c ? s / c : 0;
  });
}
function qStat(sub, key) {
  const names = presentNames(sub);
  const cm = classQMean(sub);
  const ftot = n => (SUBJ[key].fu ? (BYSTU[NAMES.indexOf(n)][EIDX[XT_EXAM.id]] || [])[12] : null);
  const tot = n => sub.stu[n].t;
  const vals = names.map(n => ({ n: n, t: tot(n) }));
  const byScore = vals.slice().sort((a, b) => b.t - a.t);
  const gN = Math.max(1, Math.round(byScore.length * 0.27));
  const hi = new Set(byScore.slice(0, gN).map(o => o.n));
  const lo = new Set(byScore.slice(-gN).map(o => o.n));
  return sub.qs.map((q, i) => {
    let sum = 0, c = 0, full = 0, zero = 0;
    let hs = 0, hc = 0, ls = 0, lc = 0;
    names.forEach(n => {
      const v = sub.stu[n].s[i];
      if (v === null || v === undefined) return;
      sum += v; c++;
      if (Math.abs(v - q.x) < 0.01) full++;
      if (v === 0) zero++;
      if (hi.has(n)) { hs += v; hc++; }
      if (lo.has(n)) { ls += v; lc++; }
    });
    const mean = c ? sum / c : 0;
    const rate = q.x ? mean / q.x : 0;
    const dHi = hc ? hs / hc / q.x : 0;
    const dLo = lc ? ls / lc / q.x : 0;
    return { i: i, q: q, mean: mean, rate: rate, cm: cm[i], gm: sub.qm[i] / q.x,
             P: rate, D: dHi - dLo, full: full, zero: zero, n: c };
  });
}

  };

  html += '<div class="kpi-cell"><div class="k">班级均分</div><div class="v">' + f1(mean) + '<span>/' + SUBJ[key].full + '</span></div><div class="d">得分率 ' + pc(mean / SUBJ[key].full, 1) + '</div></div>';
  html += '<div class="kpi-cell"><div class="k">题目数</div><div class="v">' + stats.length + '</div><div class="d">客观 ' + stats.filter(s => s.q.o).length + ' 题 · 主观 ' + stats.filter(s => !s.q.o).length + ' 题</div></div>';
  html += '<div class="kpi-cell"><div class="k">最难的题</div><div class="v">' + hardest.map(h => esc(h.q.n)).join(' / ') + '</div><div class="d">得分率 ' + hardest.map(h => pc(h.rate, 0)).join(' / ') + '</div></div>';
  html += '<div class="kpi-cell"><div class="k">区分度最高</div><div class="v">' + best.map(h => esc(h.q.n)).join(' / ') + '</div><div class="d">D＝' + best.map(h => f1(h.D, 2)).join(' / ') + '</div></div>';
  const tvals = names.map(n => sub.stu[n].t);
  const tmax = Math.max.apply(null, tvals), tmin = Math.min.apply(null, tvals);
  html += '<div class="kpi-cell"><div class="k">最高 / 最低</div><div class="v">' + f1(tmax) + '<span>/ ' + f1(tmin) + '</span></div><div class="d">标准差 ' + f1(sd(tvals)) + '</div></div>';
  const om = stats.filter(s => s.q.o), sm = stats.filter(s => !s.q.o);
  const os = om.reduce((a, b) => a + b.mean, 0), ss = sm.reduce((a, b) => a + b.mean, 0);
  const of = om.reduce((a, b) => a + b.q.x, 0), sf2 = sm.reduce((a, b) => a + b.q.x, 0);
  html += '<div class="kpi-cell"><div class="k">客观 / 主观得分率</div><div class="v">' + pc(os / (of || 1), 1) + '<span> / ' + pc(ss / (sf2 || 1), 1) + '</span></div><div class="d">客观 ' + f1(of) + ' 分 · 主观 ' + f1(sf2) + ' 分</div></div>';
  html += '</div>';

  html += '<div class="block"><div class="block-head"><h3>各题得分率：班级 vs 年级</h3>'
        + '<span class="hint">' + (S.aSort === 'weak' ? '按薄弱度排序，最上面就是最该讲的题' : '按题号排序；点右上角切成「按薄弱度排序」看短板') + '</span></div>'
        + '<div class="card"><div class="chart tall" id="chA" style="height:' + Math.max(320, stats.length * 22 + 90) + 'px"></div></div></div>';

  html += '<div class="block"><div class="block-head"><h3>小题清单</h3>'
        + '<span class="hint">难度 P＝班级均分/满分；区分度 D＝高分组得分率 − 低分组得分率（各取该科总分前/后 27%）</span></div>'
        + '<div class="tw"><table class="qt"><thead><tr><th class="l">题号</th><th>满分</th><th>班均</th><th>得分率</th><th>年级率</th><th>差</th><th>难度P</th><th>区分度D</th><th>满分</th><th>零分</th><th class="l">类型</th></tr></thead><tbody>'
        + sorted.map(s => {
          const rateCls = s.rate < 0.5 ? 'down' : (s.rate > 0.8 ? 'up' : '');
          return '<tr><td class="l">' + esc(s.q.n) + '</td><td class="num">' + f1(s.q.x) + '</td><td class="num">' + f1(s.mean)
            + '</td><td class="num ' + rateCls + '">' + pc(s.rate, 1) + '</td><td class="num">' + pc(s.gm, 1) + '</td><td class="num">' + sg((s.rate - s.gm) * 100, 1)
            + '</td><td class="num">' + f1(s.P, 2) + '</td><td class="num">' + f1(s.D, 2) + '</td><td class="num">' + s.full + '</td><td class="num">' + s.zero + '</td><td class="l">' + (s.q.o ? '客观' : '主观') + '</td></tr>';
        }).join('')
        + '</tbody></table></div>'
        + '<div class="note">读法：得分率低于 50% 的题是全班共同短板，讲评要慢；区分度 D 低于 0.2 的题，说明分数拉不开（太易或太难）；满分人数少而零分人数多的题，多半卡在“审题/表达”而不是知识。</div></div>';

  /* 讲评抓手：把这张表读成一句句能用的判断 */
  const gmean = stats.reduce((a, s) => a + s.gm * (s.q.x || 0), 0);
  const weak3 = stats.slice().sort((a, b) => a.rate - b.rate).slice(0, 3);
  const lowD = stats.filter(s => s.D < 0.2 && s.D > -0.2);
  const gapW = stats.slice().sort((a, b) => (a.rate - a.gm) - (b.rate - b.gm)).slice(0, 2).filter(s => s.rate - s.gm < -0.05);
  const acts2 = [];
  if (weak3.length) {
    acts2.push('先讲 ' + weak3.map(s => esc(s.q.n)).join('、') + ' 题：得分率只有 ' + weak3.map(s => pc(s.rate, 0)).join(' / ')
      + '，三题合计 ' + f1(weak3.reduce((a, s) => a + (s.q.x || 0), 0)) + ' 分。这几题不要只对答案，把“第一步从哪下手、采分点落在哪一句”当堂写出来，'
      + '让做错的学生跟着重写一遍。');
  }
  if (gapW.length) {
    acts2.push('和年级比，' + gapW.map(s => esc(s.q.n) + ' 题（本班 ' + pc(s.rate, 0) + '，年级 ' + pc(s.gm, 0) + '）').join('、')
      + '落后最多。同一份卷子别人能拿，说明不是题难，而是我们的教与练漏了口径——回扣到对应的知识点重练一轮。');
  }
  if (lowD.length) {
    acts2.push('区分度 D 低于 0.2 的有 ' + lowD.map(s => esc(s.q.n)).join('、') + ' 题：分数拉不开，要么人人会、要么人人不会，'
      + '这些题最多带一句“过”，别占正课时间。');
  }
  const objRate = stats.filter(s => s.q.o), subRate = stats.filter(s => !s.q.o);
  if (objRate.length && subRate.length) {
    const or2 = objRate.reduce((a, s) => a + s.mean, 0) / objRate.reduce((a, s) => a + (s.q.x || 0), 0);
    const sr2 = subRate.reduce((a, s) => a + s.mean, 0) / subRate.reduce((a, s) => a + (s.q.x || 0), 0);
    acts2.push('客观题得分率 ' + pc(or2, 0) + '，主观题 ' + pc(sr2, 0) + '。' + (sr2 < or2
      ? '主观题是最大的提分池：按题号定“必得分点”，每次周测只盯三条，写到点上为止。'
      : '客观题反而弱，先把概念辨析和审题口径补上，别急着刷难题。'));
  }
  html += '<div class="block"><div class="block-head"><h3>讲评抓手</h3>'
        + '<span class="hint">' + SUBJ[key].n + ' · 班级均分 ' + f1(mean) + '（年级 ' + f1(gmean) + '）· 按数据生成</span></div>'
        + '<div class="talk">' + acts2.map(t => '<p>' + t + '</p>').join('') + '</div></div>';

  out.innerHTML = html;

  const cq = S.aSort === 'weak' ? stats.slice().sort((a, b) => a.rate - b.rate) : qOrder(sub.qs).map(i => stats[i]);
  const rev = cq.map(s => ({ n: s.q.n, r: +(s.rate * 100).toFixed(1), g: +(s.gm * 100).toFixed(1) })).reverse();
  chart('chA', {
    tooltip: Object.assign(baseTip(), {
      formatter: p => {
        const o = rev[p[0].dataIndex];
        return '<b>' + o.n + ' 题</b><br>班级 ' + o.r + '% ／ 年级 ' + o.g + '%';
      }
    }),
    grid: { left: 8, right: 46, top: 26, bottom: 8, containLabel: true },
    legend: { top: 0, right: 4, itemWidth: 10, itemHeight: 10, textStyle: { color: C.ink3, fontSize: 11 } },
    xAxis: valAxis({ max: 100, axisLabel: { color: C.ink3, fontSize: 10, formatter: '{value}%' } }),
    yAxis: catAxis(rev.map(o => o.n), { axisLabel: { color: C.ink3, fontSize: 10 } }),
    series: [
      { name: '班级得分率', type: 'bar', barMaxWidth: 12, data: rev.map(o => o.r),
        itemStyle: { color: p => (rev[p.dataIndex].r < 50 ? C.red : C.green2) } },
      { name: '年级得分率', type: 'line', symbol: 'rect', symbolSize: 5, data: rev.map(o => o.g),
        lineStyle: { color: C.ink3, width: 1, type: 'dashed' }, itemStyle: { color: C.ink3 } }
    ]
  });
}

/* ===== 视图三：科目分析（教师） ===== */
function examRows(ei) {
  const arr = [];
  NAMES.forEach((n, si) => { const r = BYSTU[si][ei]; if (r) arr.push({ si: si, n: n, r: r }); });
  return arr;
}
function renderSubj() {
  const out = $('#sOut');
  const key = S.tSubj;
  const sub = XT[key];
  const ei = EIDX[S.tExam];
  const ex = EXAMS[ei];
  const list = examRows(ei).map(o => ({
    si: o.si, n: o.n, r: o.r,
    sc: o.r[6 + KEYS.indexOf(key)],
    fu: (key === 'c' ? o.r[12] : (key === 'b' ? o.r[13] : null))
  })).filter(o => o.sc !== null && o.sc !== undefined);

  const line = getLine(S.tExam, key);
  const mean = list.reduce((a, b) => a + b.sc, 0) / (list.length || 1);
  const sorted = list.slice().sort((a, b) => b.sc - a.sc);
  const pass = line === null ? [] : sorted.filter(o => o.sc >= line);
  const near = line === null ? [] : sorted.filter(o => Math.abs(o.sc - line) <= 10);

  let html = '<div class="kpi">';
  html += '<div class="kpi-cell"><div class="k">参考人数</div><div class="v">' + list.length + '<span>/' + NAMES.length + '</span></div><div class="d">' + ex.label + '</div></div>';
  html += '<div class="kpi-cell"><div class="k">本科均分</div><div class="v">' + f1(mean) + '</div><div class="d">满分 ' + SUBJ[key].full + ' · 得分率 ' + pc(mean / SUBJ[key].full, 1) + '</div></div>';
  html += '<div class="kpi-cell"><div class="k">本科划线</div><div class="v">' + (line === null ? '未录' : f1(line)) + '</div><div class="d">' + (line === null ? '在左上角输入后即算名单' : '线下 10 分内算临界') + '</div></div>';
  html += '<div class="kpi-cell"><div class="k">上线人数</div><div class="v">' + (line === null ? '—' : pass.length) + '<span>' + (line === null ? '' : '/ ' + list.length) + '</span></div><div class="d">' + (line === null ? '—' : '上线率 ' + pc(pass.length / (list.length || 1), 1)) + '</div></div>';
  html += '<div class="kpi-cell"><div class="k">临界人数</div><div class="v">' + (line === null ? '—' : near.length) + '</div><div class="d">' + (line === null ? '—' : '线上守线 ' + near.filter(o => o.sc >= line).length + ' · 线下冲刺 ' + near.filter(o => o.sc < line).length) + '</div></div>';
  html += '<div class="kpi-cell"><div class="k">最高 / 最低</div><div class="v">' + f1(sorted[0] ? sorted[0].sc : null) + '<span>/ ' + f1(sorted[sorted.length - 1] ? sorted[sorted.length - 1].sc : null) + '</span></div><div class="d">标准差 ' + f1(sd(list.map(o => o.sc))) + '</div></div>';
  html += '</div>';

  html += '<div class="block"><div class="block-head"><h3>' + SUBJ[key].n + '成绩分布</h3>'
        + '<span class="hint">' + ex.label + ' · 每 10 分一档' + (line === null ? '' : ' · 竖线为划线 ' + f1(line)) + '</span></div>'
        + '<div class="card"><div class="chart" id="chDist" style="height:260px"></div></div></div>';

  const rankMap = {};
  sorted.forEach((o, i) => { rankMap[o.n] = i + 1; });
  const showAll = !!S.showAll || line === null;
  const shown = showAll ? sorted : sorted.filter(o => o.sc >= line - 10);
  html += '<div class="block"><div class="block-head"><h3>上线名单</h3>'
        + (line === null ? '' : '<button class="btn ghost" id="sAll" style="font-size:12px;padding:3px 10px;margin-left:6px">' + (showAll ? '只看线上＋临界' : '显示全部 ' + sorted.length + ' 人') + '</button>')
        + '<span class="hint">' + (line === null ? '先录入划线，才判名单' : '达标 ' + pass.length + ' 人 · 临界 ' + near.length + ' 人 · 当前显示 ' + shown.length + ' 人') + '</span></div>'
        + '<div class="tw"><table class="qt"><thead><tr><th class="l">姓名</th><th>本科得分</th>' + (SUBJ[key].fu ? '<th>赋分</th>' : '')
        + '<th>与线差</th><th class="l">状态</th><th>班排</th><th>总分(赋分)</th><th>总分校排</th></tr></thead><tbody>'
        + shown.map(o => {
          const d = line === null ? null : o.sc - line;
          let tag = '<span class="tag">—</span>';
          if (d !== null) {
            if (d >= 0 && d <= 10) tag = '<span class="tag warn">守线</span>';
            else if (d >= 0) tag = '<span class="tag ok">上线</span>';
            else if (d >= -10) tag = '<span class="tag warn">冲刺</span>';
            else tag = '<span class="tag">未达</span>';
          }
          return '<tr class="' + (o.n === S.tName ? 'hl' : '') + '" data-n="' + esc(o.n) + '"><td class="l">' + esc(o.n) + '</td><td class="num">' + f1(o.sc) + '</td>'
            + (SUBJ[key].fu ? '<td class="num">' + f1(o.fu) + '</td>' : '')
            + '<td class="num ' + (d === null ? '' : (d >= 0 ? 'up' : 'down')) + '">' + (d === null ? '—' : sg(d)) + '</td>'
            + '<td class="l">' + tag + '</td><td class="num">' + rankMap[o.n] + '</td><td class="num">' + f1(o.r[3]) + '</td><td class="num">' + (o.r[5] === null ? '—' : o.r[5]) + '</td></tr>';
        }).join('')
        + '</tbody></table></div>'
        + '<div class="note">点名单里任意一行，下方即换成该生的' + SUBJ[key].n + '历次走势。划线保存在本机，和成绩台账的单科线是同一份。</div></div>';

  const nm = (S.tName || '').trim();
  const si = NAMES.indexOf(nm);
  if (nm && si < 0) {
    html += '<div class="block"><div class="block-head"><h3>个人历次走势</h3></div><div class="empty">名册里没有「' + esc(nm) + '」。</div></div>';
  } else if (nm) {
    const recs = BYSTU[si];
    const xs = [], a = [], b = [], cl = [], rk = [], total = [];
    let present = 0, passN = 0, sum = 0;
    EXAMS.forEach((e, i) => {
      const r = recs[i];
      xs.push(e.short);
      if (!r) { a.push(null); b.push(null); cl.push(null); rk.push(null); total.push(null); return; }
      const v = r[6 + KEYS.indexOf(key)];
      a.push(v); b.push(null); cl.push(getLine(e.id, key)); rk.push(r[2]); total.push(r[3]);
      if (v !== null) { present++; sum += v; if (getLine(e.id, key) !== null && v >= getLine(e.id, key)) passN++; }
    });
    /* 班均序列 */
    EXAMS.forEach((e, i) => {
      const arr = examRows(i).map(o => o.r[6 + KEYS.indexOf(key)]).filter(v => v !== null && v !== undefined);
      b[i] = arr.length ? +(arr.reduce((x, y) => x + y, 0) / arr.length).toFixed(1) : null;
    });
    const vals = a.filter(v => v !== null);
    const best = vals.length ? Math.max.apply(null, vals) : null;
    const worst = vals.length ? Math.min.apply(null, vals) : null;
    const lastThree = vals.slice(-3);
    const trend = lastThree.length >= 2 ? lastThree[lastThree.length - 1] - lastThree[0] : null;

    html += '<div class="block"><div class="block-head"><h3>' + esc(nm) + ' · ' + SUBJ[key].n + ' 九次走势</h3>'
          + '<span class="hint">共 ' + present + ' 次有分 · 均 ' + f1(present ? sum / present : null) + ' · 最好 ' + f1(best) + ' / 最差 ' + f1(worst)
          + (line === null ? '' : ' · 达线 ' + passN + ' 次') + '</span></div>'
          + '<div class="card"><div class="chart" id="chTrend" style="height:320px"></div></div></div>';

    html += '<div class="block"><div class="block-head"><h3>' + esc(nm) + ' · 该科班级名次走势</h3>'
          + '<span class="hint">纵轴反向，越靠上名次越好</span></div>'
          + '<div class="card"><div class="chart" id="chRank" style="height:280px"></div></div></div>';

    html += '<div class="block"><div class="block-head"><h3>九次明细</h3><span class="hint">划线为当次录入值，未录显示 —</span></div>'
          + '<div class="tw"><table class="qt"><thead><tr><th class="l">考试</th><th>' + SUBJ[key].n + '</th><th>班均</th><th>与班均差</th><th>划线</th><th>达线</th><th>班级名次</th><th>总分(赋分)</th><th>总分校排</th></tr></thead><tbody>'
          + EXAMS.map((e, i) => {
            const r = recs[i];
            if (!r) return '<tr><td class="l">' + esc(e.short) + '</td><td class="num" colspan="8" style="color:' + C.ink3 + '">缺考</td></tr>';
            const v = r[6 + KEYS.indexOf(key)];
            const lv = getLine(e.id, key);
            const dd = (v !== null && lv !== null) ? v - lv : null;
            return '<tr><td class="l">' + esc(e.short) + '</td><td class="num">' + f1(v) + '</td><td class="num">' + f1(b[i]) + '</td><td class="num">' + sg(v - b[i]) + '</td>'
              + '<td class="num">' + (lv === null ? '—' : f1(lv)) + '</td><td class="l">' + (dd === null ? '—' : (dd >= 0 ? '<span class="tag ok">达线</span>' : '<span class="tag bad">未达</span>')) + '</td>'
              + '<td class="num">' + (r[2] === null ? '—' : r[2]) + '</td><td class="num">' + f1(r[3]) + '</td><td class="num">' + (r[5] === null ? '—' : r[5]) + '</td></tr>';
          }).join('')
          + '</tbody></table></div></div>';

    const txt = [];
    txt.push('<p><b>' + esc(nm) + '</b> 的' + SUBJ[key].n + '，' + present + ' 次有分，平均 ' + f1(present ? sum / present : null)
      + ' 分' + (present >= 2 ? '，最好 ' + f1(best) + '、最差 ' + f1(worst) + '，波动 ' + f1(best - worst) + ' 分' : '') + '。</p>');
    if (trend !== null) {
      txt.push('<p>最近三次的位置：' + lastThree.map(v => f1(v)).join(' → ') + '，' + (trend > 3 ? '在往上走' : (trend < -3 ? '在下滑，要盯住' : '基本持平')) + '（' + sg(trend) + ' 分）。</p>');
    }
    if (line !== null) txt.push('<p>' + SUBJ[key].n + '线 ' + f1(line) + ' 分，共达线 <b>' + passN + '</b> 次；本次（' + ex.label + '）' + (function () {
      const r = recs[ei]; if (!r) return '缺考。';
      const v = r[6 + KEYS.indexOf(key)];
      const d = v === null ? null : v - line;
      return d === null ? '无成绩。' : (d >= 0 ? '高出线 ' + f1(d) + ' 分。' : '距线还差 ' + f1(-d) + ' 分。');
    })() + '</p>');
    if (sub.stu && XT_EXAM.id === S.tExam) {
      txt.push('<p>本科已有小题分（' + XT_EXAM.label + '），逐题得失与错项可到「小题分查看」页看，那边能定位到具体哪几题在丢分。</p>');
    }
    html += '<div class="block"><div class="block-head"><h3>给班主任的三句话</h3></div><div class="talk">' + txt.join('') + '</div></div>';

    out.innerHTML = html;
    bindList();
    /* 分布 */
    drawDist(sorted.map(o => o.sc), line, key);
    /* 走势 */
    chart('chTrend', {
      tooltip: baseTip(),
      grid: { left: 8, right: 20, top: 34, bottom: 30, containLabel: true },
      legend: { top: 0, right: 4, itemWidth: 10, itemHeight: 10, textStyle: { color: C.ink3, fontSize: 11 } },
      xAxis: catAxis(xs, { axisLabel: { color: C.ink3, fontSize: 10, interval: 0, rotate: 30 } }),
      yAxis: valAxis({ axisLabel: { color: C.ink3, fontSize: 10 } }),
      series: [
        { name: nm, type: 'line', data: a, connectNulls: false, symbolSize: 6,
          lineStyle: { color: C.green, width: 2 }, itemStyle: { color: C.green } },
        { name: '班均', type: 'line', data: b, symbol: 'none',
          lineStyle: { color: C.ink3, width: 1, type: 'dashed' }, itemStyle: { color: C.ink3 } },
        { name: '划线', type: 'line', data: cl, symbol: 'rect', symbolSize: 4, connectNulls: true,
          lineStyle: { color: C.red, width: 1, type: 'dotted' }, itemStyle: { color: C.red } }
      ]
    });

    const rkSeries = rk.map(v => v);
    chart('chRank', {
      tooltip: baseTip(),
      grid: { left: 8, right: 20, top: 20, bottom: 30, containLabel: true },
      xAxis: catAxis(xs, { axisLabel: { color: C.ink3, fontSize: 10, interval: 0, rotate: 30 } }),
      yAxis: valAxis({ inverse: true, min: 1, minInterval: 1, axisLabel: { color: C.ink3, fontSize: 10, formatter: '{value}' } }),
      series: [{ name: '班级名次', type: 'line', data: rkSeries, symbolSize: 6, connectNulls: true,
        lineStyle: { color: C.blue, width: 2 }, itemStyle: { color: C.blue },
        label: { show: true, fontSize: 10, color: C.ink2, formatter: p => p.value } }]
    });
    return;
  }

  out.innerHTML = html;
  bindList();
  drawDist(sorted.map(o => o.sc), line, key);
}

function bindList() {
  const out = $('#sOut');
  const b = $('#sAll');
  if (b) b.addEventListener('click', () => { S.showAll = !S.showAll; renderSubj(); });
  out.querySelectorAll('tr[data-n]').forEach(tr => {
    tr.style.cursor = 'pointer';
    tr.addEventListener('click', () => {
      S.tName = tr.getAttribute('data-n');
      const inp = $('#sName');
      if (inp) inp.value = S.tName;
      renderSubj();
    });
  });
}

function sd(arr) {
  const v = arr.filter(x => x !== null && x !== undefined && isFinite(x));
  if (!v.length) return null;
  const m = v.reduce((a, b) => a + b, 0) / v.length;
  return Math.sqrt(v.reduce((a, b) => a + (b - m) * (b - m), 0) / v.length);
}

function drawDist(vals, line, key) {
  if (!vals.length) return;
  const min = Math.floor(Math.min.apply(null, vals) / 10) * 10;
  const max = Math.ceil(Math.max.apply(null, vals) / 10) * 10;
  const bins = [];
  for (let x = min; x < max; x += 10) bins.push(x);
  const cnt = bins.map(b => vals.filter(v => v >= b && v < b + 10).length);
  let markData = [];
  if (line !== null) {
    let bi = bins.findIndex(b => line >= b && line < b + 10);
    if (bi < 0) bi = line < min ? 0 : bins.length - 1;
    markData = [{
      xAxis: bins[bi] + '–' + (bins[bi] + 10),
      label: { formatter: '线 ' + f1(line), color: C.red, fontSize: 11, position: 'insideEndTop', rotate: 0 },
      lineStyle: { color: C.red, type: 'dashed' }
    }];
  }
  chart('chDist', {
    tooltip: Object.assign(baseTip(), { formatter: p => bins[p[0].dataIndex] + '–' + (bins[p[0].dataIndex] + 10) + ' 分：' + cnt[p[0].dataIndex] + ' 人' }),
    grid: { left: 8, right: 16, top: 30, bottom: 8, containLabel: true },
    xAxis: catAxis(bins.map(b => b + '–' + (b + 10)), { axisLabel: { color: C.ink3, fontSize: 10, interval: Math.max(0, Math.floor(bins.length / 10)) } }),
    yAxis: valAxis({ minInterval: 1, axisLabel: { color: C.ink3, fontSize: 10 } }),
    series: [{ type: 'bar', barMaxWidth: 26, data: cnt, itemStyle: { color: C.green2 }, markLine: { symbol: 'none', silent: true, data: markData } }]
  });
}

/* ===== 初始化 ===== */
function fillSelect(sel, opts, val) {
  if (!sel) return;
  sel.innerHTML = opts.map(o => '<option value="' + esc(o.v) + '">' + esc(o.t) + '</option>').join('');
  if (val) sel.value = val;
}
function init() {
  const xtExams = [{ v: XT_EXAM.id, t: XT_EXAM.label + '（有小题分）' }];
  const allExams = EXAMS.map(e => ({ v: e.id, t: (e.short || e.label) }));

  fillSelect($('#xExam'), xtExams, S.exam);
  fillSelect($('#aExam'), xtExams, S.aExam);
  fillSelect($('#sExam'), allExams, S.tExam);
  const subOpts = KEYS.map(k => ({ v: k, t: SUBJ[k].n }));
  fillSelect($('#xSubj'), subOpts, S.subj);
  fillSelect($('#aSubj'), subOpts, S.aSubj);
  fillSelect($('#sSubj'), subOpts, S.tSubj);

  const dl = $('#xNameList');
  if (dl) dl.innerHTML = NAMES.map(n => '<option value="' + esc(n) + '"></option>').join('');

  ['#xExam', '#xSubj'].forEach(s => $(s).addEventListener('change', () => {
    S.exam = $('#xExam').value; S.subj = $('#xSubj').value; renderStu();
  }));
  ['#aExam', '#aSubj'].forEach(s => $(s).addEventListener('change', () => {
    S.aExam = $('#aExam').value; S.aSubj = $('#aSubj').value; renderAna();
  }));
  ['#sExam', '#sSubj'].forEach(s => $(s).addEventListener('change', () => {
    S.tExam = $('#sExam').value; S.tSubj = $('#sSubj').value;
    const lv = getLine(S.tExam, S.tSubj);
    $('#sLine').value = lv === null ? '' : lv;
    renderSubj();
  }));

  $('#xName').addEventListener('change', () => { S.name = $('#xName').value; renderStu(); });
  $('#xGo').addEventListener('click', () => { S.name = $('#xName').value; renderStu(); });
  $('#xRand').addEventListener('click', () => {
    const pool = presentNames(XT[S.subj]).filter(n => n !== S.name);
    S.name = pool[Math.floor(Math.random() * pool.length)] || NAMES[0];
    $('#xName').value = S.name; renderStu();
  });

  $('#aSort').addEventListener('click', () => {
    S.aSort = S.aSort === 'weak' ? 'no' : 'weak';
    $('#aSort').textContent = S.aSort === 'weak' ? '按薄弱度排序' : '按题号排序';
    renderAna();
  });

  $('#sLine').addEventListener('change', () => {
    const v = $('#sLine').value.trim();
    setLine(S.tExam, S.tSubj, v === '' ? null : Number(v));
    renderSubj();
  });
  $('#sName').addEventListener('change', () => { S.tName = $('#sName').value; renderSubj(); });
  $('#sGo').addEventListener('click', () => { S.tName = $('#sName').value; renderSubj(); });

  document.querySelectorAll('.tabs button[data-tab]').forEach(b => {
    b.addEventListener('click', () => switchTab(b.getAttribute('data-tab')));
  });

  /* 初始 */
  const lv0 = getLine(S.tExam, S.tSubj);
  $('#sLine').value = lv0 === null ? '' : lv0;
  const tick = $('#footTick');
  if (tick) tick.textContent = '小题分 ' + XT_EXAM.label + ' · 六科 · 生成于 ' + new Date().toLocaleDateString('zh-CN');
  renderStu();
}

const DONE = { stu: 1, ana: 0, subj: 0 };

function switchTab(tab) {
  S.tab = tab;
  document.querySelectorAll('.tabs button[data-tab]').forEach(b => {
    b.setAttribute('aria-selected', b.getAttribute('data-tab') === tab ? 'true' : 'false');
  });
  ['stu', 'ana', 'subj'].forEach(t => {
    const sec = document.getElementById('view-' + t);
    if (sec) sec.hidden = (t !== tab);
  });
  if (!DONE[tab]) {
    if (tab === 'ana') renderAna();
    if (tab === 'subj') renderSubj();
    DONE[tab] = 1;
  }
  Object.keys(CH).forEach(k => { try { CH[k].resize(); } catch (e) {} });
}

window.addEventListener('resize', () => {
  Object.keys(CH).forEach(k => { try { CH[k].resize(); } catch (e) {} });
});

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

</script>
